name: Build

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The app builds against the AudienceKit Kotlin SDK from source (a Gradle composite build).
      # audience-kit is private, so this needs a read-only deploy key on it (AUDIENCE_KIT_SSH_KEY,
      # preferred) or a token that can read it (AUDIENCE_KIT_TOKEN).
      - name: Check for AudienceKit access
        env:
          AUDIENCE_KIT_SSH_KEY: ${{ secrets.AUDIENCE_KIT_SSH_KEY }}
          AUDIENCE_KIT_TOKEN: ${{ secrets.AUDIENCE_KIT_TOKEN }}
        run: |
          if [ -z "$AUDIENCE_KIT_SSH_KEY" ] && [ -z "$AUDIENCE_KIT_TOKEN" ]; then
            echo "::error::Add an AUDIENCE_KIT_SSH_KEY repository secret (the private half of a read-only deploy key on audience-kit/audience-kit), or an AUDIENCE_KIT_TOKEN that can read it."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          repository: audience-kit/audience-kit
          ref: master
          # With a deploy key git uses SSH; otherwise the token.
          ssh-key: ${{ secrets.AUDIENCE_KIT_SSH_KEY }}
          token: ${{ secrets.AUDIENCE_KIT_TOKEN || github.token }}
          path: audience-kit
          sparse-checkout: sdk/kotlin

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # The runner image doesn't always come with an Android SDK, and without one (no ANDROID_HOME)
      # settings.gradle.kts leaves the app out. AGP downloads the platforms the build needs.
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and run unit tests
        run: ./gradlew :core:test assembleDebug testDebugUnitTest
