name: Build

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The app builds against the AudienceKit Kotlin SDK from source (a Gradle composite build).
      # audience-kit is private, so this needs a token that can read it.
      - name: Check for the AudienceKit token
        env:
          AUDIENCE_KIT_TOKEN: ${{ secrets.AUDIENCE_KIT_TOKEN }}
        run: |
          if [ -z "$AUDIENCE_KIT_TOKEN" ]; then
            echo "::error::Add an AUDIENCE_KIT_TOKEN repository secret (a token with read access to audience-kit/audience-kit)."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          repository: audience-kit/audience-kit
          ref: master
          token: ${{ secrets.AUDIENCE_KIT_TOKEN }}
          path: audience-kit
          sparse-checkout: sdk/kotlin

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and run unit tests
        run: ./gradlew :core:test assembleDebug testDebugUnitTest
